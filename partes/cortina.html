<!-- Cortina «La placa» (agente Mesa). Va justo después de <body>. Autónoma: lleva su CSS crítico y su red de seguridad. -->
<style>
  /* La losa de granito de la entrada se parte por la junta ENTRE | MUROS y se abre como una puerta corredera.
     Todo lo que se mueve va por transform (compositor): la luz rasante destapa el relieve deslizando una capa, sin repintar. */
  .cortina { position: fixed; inset: 0; z-index: 9999; pointer-events: none; overflow: hidden;
    --luz: -25; /* posición de la luz rasante, en vw (la mueve cortina.js) */
    --pw: min(94vw, calc(86svh * 1340 / 1100), 1560px); /* ancho de la imagen de la placa, con su margen de sombra */
    --corte: .4716; /* fracción de la imagen donde está la junta (img/mesa/placa.json) */
    --plumas: 9vw; /* borde blando de la luz */ }
  .cortina[hidden], html.cortina-fuera .cortina { display: none !important; }
  .cortina-losa { position: absolute; top: 0; bottom: 0; width: 50.05%; will-change: transform; }
  .cortina-izq { left: 0; }
  .cortina-der { right: 0; }
  .cortina-cara { position: absolute; inset: 0; overflow: hidden; background: var(--granito-2, #8F8473) url("img/mesa/granito-512.webp") 0 0 / 512px 512px; }
  .cortina-cara::after { content: ""; position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% 45%, rgba(0,0,0,0) 40%, rgba(24,20,14,.34) 100%); pointer-events: none; }
  .cortina-placa { position: absolute; top: 50%; width: var(--pw); aspect-ratio: 1340 / 1100; translate: 0 -50%; will-change: transform; }
  .cortina-izq .cortina-placa { left: calc(100% - var(--corte) * var(--pw)); }
  .cortina-der .cortina-placa { left: calc(-1 * var(--corte) * var(--pw)); }
  .cortina-placa img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  /* la capa con el relieve fuerte (luz rasante) está tapada hasta que pasa la luz: se desliza de izquierda a derecha */
  .cortina-ras { position: absolute; left: 0; top: 0; bottom: 0; width: calc(50vw + var(--plumas)); overflow: hidden; transform: translate3d(-101%, 0, 0); will-change: transform;
    -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - var(--plumas)), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - var(--plumas)), transparent); }
  .cortina-ras-in { position: absolute; left: 0; top: 0; width: 50vw; height: 100%; will-change: transform; transform: translate3d(101%, 0, 0); }
  /* canto cortado: un filo claro y la sombra que cae sobre lo que queda detrás al abrirse */
  .cortina-canto { position: absolute; top: 0; bottom: 0; width: 3px; opacity: 0; background: linear-gradient(180deg, rgba(255,244,222,.5), rgba(255,244,222,.18)); }
  .cortina-izq .cortina-canto { right: 0; }
  .cortina-der .cortina-canto { left: 0; }
  .cortina-sombra { position: absolute; top: 0; bottom: 0; width: clamp(40px, 7vw, 110px); opacity: 0; }
  .cortina-izq .cortina-sombra { left: 100%; background: linear-gradient(90deg, rgba(30,22,12,.5), rgba(30,22,12,0)); }
  .cortina-der .cortina-sombra { right: 100%; background: linear-gradient(270deg, rgba(30,22,12,.5), rgba(30,22,12,0)); }
  .cortina-brillo { position: absolute; top: 0; bottom: 0; left: 0; width: 26vw; opacity: 0; mix-blend-mode: screen; will-change: transform, opacity;
    background: linear-gradient(90deg, rgba(255,226,170,0), rgba(255,232,184,.34) 55%, rgba(255,226,170,0)); }
  html.con-cortina { overflow: hidden; }
  @media (prefers-reduced-motion: reduce) { .cortina { display: none !important; } html.con-cortina { overflow: auto; } }
</style>
<div id="cortina" class="cortina" aria-hidden="true">
  <div class="cortina-losa cortina-izq">
    <div class="cortina-cara">
      <div class="cortina-placa"><picture><source media="(max-width: 760px)" type="image/avif" srcset="img/mesa/placa-base-sm.avif"><source media="(max-width: 760px)" type="image/webp" srcset="img/mesa/placa-base-sm.webp"><source type="image/avif" srcset="img/mesa/placa-base-lg.avif"><img class="cortina-base" src="img/mesa/placa-base-lg.webp" width="1340" height="1100" alt="" fetchpriority="high" decoding="async"></picture></div>
      <div class="cortina-ras"><div class="cortina-ras-in"><div class="cortina-placa"><picture><source media="(max-width: 760px)" type="image/avif" srcset="img/mesa/placa-rasante-sm.avif"><source media="(max-width: 760px)" type="image/webp" srcset="img/mesa/placa-rasante-sm.webp"><source type="image/avif" srcset="img/mesa/placa-rasante-lg.avif"><img src="img/mesa/placa-rasante-lg.webp" width="1340" height="1100" alt="" fetchpriority="low" decoding="async"></picture></div></div></div>
    </div>
    <div class="cortina-canto"></div>
    <div class="cortina-sombra"></div>
  </div>
  <div class="cortina-losa cortina-der">
    <div class="cortina-cara">
      <div class="cortina-placa"><picture><source media="(max-width: 760px)" type="image/avif" srcset="img/mesa/placa-base-sm.avif"><source media="(max-width: 760px)" type="image/webp" srcset="img/mesa/placa-base-sm.webp"><source type="image/avif" srcset="img/mesa/placa-base-lg.avif"><img src="img/mesa/placa-base-lg.webp" width="1340" height="1100" alt="" decoding="async"></picture></div>
      <div class="cortina-ras"><div class="cortina-ras-in"><div class="cortina-placa"><picture><source media="(max-width: 760px)" type="image/avif" srcset="img/mesa/placa-rasante-sm.avif"><source media="(max-width: 760px)" type="image/webp" srcset="img/mesa/placa-rasante-sm.webp"><source type="image/avif" srcset="img/mesa/placa-rasante-lg.avif"><img src="img/mesa/placa-rasante-lg.webp" width="1340" height="1100" alt="" decoding="async"></picture></div></div></div>
    </div>
    <div class="cortina-canto"></div>
    <div class="cortina-sombra"></div>
  </div>
  <div class="cortina-brillo"></div>
</div>
<noscript><style>.cortina { display: none !important; } html.con-cortina { overflow: auto; }</style></noscript>
<script>
  /* Red de seguridad: la cortina se retira SIEMPRE, aunque no llegue js/cortina.js (ni GSAP, ni nada). */
  (function () {
    var d = document.documentElement;
    try { if (!matchMedia('(prefers-reduced-motion: reduce)').matches) d.classList.add('con-cortina'); } catch (e) {}
    setTimeout(function () { d.classList.remove('con-cortina'); d.classList.add('cortina-fuera'); }, 4500);
  })();
</script>
