<!-- script bloqueante: clases antes del primer pintado y el puente con la cortina (partes/cortina.html, de Mesa) -->
<script>
(function (d) {
  var h = d.documentElement;
  h.classList.add('js');
  // MANDO DE MAQUETA (no viaja al cliente): solo con ?revision
  try {
    var q = new URLSearchParams(location.search);
    if (q.has('revision')) {
      h.classList.add('revision');
      if (q.get('densidad') === 'sobria') h.classList.add('densidad-sobria');
    }
  } catch (e) {}
  // el puente con la cortina: existe desde el primer momento, cargue antes quien cargue.
  // La cortina llama a Entremuros.abrir() cuando EMPIEZA a abrirse y a Entremuros.retirarCortina() al acabar
  // (o lanza los eventos entremuros:cortina-abre / entremuros:cortina-fuera en document);
  // la web y los módulos usan Entremuros.alAbrirse(fn).
  var E = window.Entremuros = window.Entremuros || {};
  var cola = [];
  var avisar = function (n) { try { d.dispatchEvent(new CustomEvent(n)); } catch (e) {} };
  E.alAbrirse = function (fn) { if (E.abierta) { try { fn(); } catch (e) { console.warn(e); } } else cola.push(fn); };
  E.abrir = function () {
    if (E.abierta) return;
    E.abierta = true;
    cola.splice(0).forEach(function (fn) { try { fn(); } catch (e) { console.warn(e); } });
    avisar('entremuros:abierta');
  };
  E.retirarCortina = function () {
    if (E.cortinaFuera) return;
    E.cortinaFuera = true;
    clearTimeout(window.__redCortina);
    h.classList.remove('cortina-activa');
    h.classList.add('cortina-fuera');
    E.abrir();
    avisar('entremuros:fuera');
  };
  d.addEventListener('entremuros:cortina-abre', function () { E.abrir(); });
  d.addEventListener('entremuros:cortina-fuera', function () { E.retirarCortina(); });
  // red de seguridad por si main.js o la cortina no llegan: la cortina se va sola
  window.__redCortina = setTimeout(function () { E.retirarCortina(); }, 6500);
})(document);
</script>
